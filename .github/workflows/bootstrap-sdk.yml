name: Bootstrap vendored SDK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-sdk:
    runs-on: windows-2022
    steps:
      - name: Check out Prism Agent SDK source
        uses: actions/checkout@v4
        with:
          repository: DIBULI/Prism-agent
          ref: master
          path: prism-agent
          ssh-key: ${{ secrets.PRISM_AGENT_DEPLOY_KEY }}
          persist-credentials: false

      - name: Build and install Windows SDK
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "prism-sdk-build"
          $stage = Join-Path $env:RUNNER_TEMP "prism-sdk-stage"
          cmake -S prism-agent/prism-sdk/usb-sdk -B $build -A x64 `
            -DPRISM_USB_SDK_SHARED=ON `
            -DPRISM_USB_SDK_BUILD_EXAMPLES=OFF `
            -DBUILD_TESTING=ON
          cmake --build $build --config Release --parallel
          ctest --test-dir $build -C Release --output-on-failure
          cmake --install $build --config Release --prefix $stage

      - name: Upload Windows SDK
        uses: actions/upload-artifact@v4
        with:
          name: prism-host-sdk-0.9.0-windows-x64
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/prism-sdk-stage/include
            ${{ runner.temp }}/prism-sdk-stage/bin/prism_usb_sdk.dll

  linux-sdk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Prism Agent SDK source
        uses: actions/checkout@v4
        with:
          repository: DIBULI/Prism-agent
          ref: master
          path: prism-agent
          ssh-key: ${{ secrets.PRISM_AGENT_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Linux SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libusb-1.0-0-dev libssl-dev

      - name: Build and install Linux SDK
        run: |
          cmake -S prism-agent/prism-sdk/usb-sdk \
            -B "$RUNNER_TEMP/prism-sdk-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPRISM_USB_SDK_SHARED=ON \
            -DPRISM_USB_SDK_BUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=ON
          cmake --build "$RUNNER_TEMP/prism-sdk-build" --parallel
          ctest --test-dir "$RUNNER_TEMP/prism-sdk-build" \
            --output-on-failure
          cmake --install "$RUNNER_TEMP/prism-sdk-build" \
            --prefix "$RUNNER_TEMP/prism-sdk-stage"

      - name: Upload Linux SDK
        uses: actions/upload-artifact@v4
        with:
          name: prism-host-sdk-0.9.0-linux-x64
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/prism-sdk-stage/include
            ${{ runner.temp }}/prism-sdk-stage/lib/libprism_usb_sdk.so
