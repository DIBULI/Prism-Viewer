name: Viewer 1.2.3 Windows CORS fix
on:
  push:
    branches: [codex/viewer-1.2.3-timesync-cors]
  workflow_dispatch:
permissions:
  contents: read
env:
  QT_QPA_PLATFORM: offscreen
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    # Use the native Windows font/style metrics, matching the shipped GUI.
    # Qt's offscreen backend has different default metrics on Windows.
    env:
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP/Qt" -m qtcharts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "QT_PREFIX=$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build and test
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and smoke test
        shell: pwsh
        run: ./scripts/package_pps5_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-1.2.3-windows-x64
          path: Prism-Viewer-1.2.3-windows-x64.zip
          if-no-files-found: error
