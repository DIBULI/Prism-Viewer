name: PPS5 maintenance validation
on:
  push:
    branches: ["codex/maintenance-1.2.1-pps5ms"]
    tags: ["v1.2.1-pps5ms"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y qtbase5-dev qtdeclarative5-dev qtquickcontrols2-5-dev libqt5opengl5-dev libqt5charts5-dev libusb-1.0-0-dev libssl-dev
      - run: cmake -S . -B build -DBUILD_TESTING=ON -DPRISM_LINK_STATIC_LINUX_SDK=OFF -DPRISM_DEPLOY_RUNTIME_DEPENDENCIES=OFF && cmake --build build -j2
      - run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
