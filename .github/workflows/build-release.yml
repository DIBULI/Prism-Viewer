name: Build and release Prism Viewer

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prism-viewer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - name: Check out Viewer
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          $qtRoot = Join-Path $env:RUNNER_TEMP "Qt"
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 `
            -O $qtRoot -m qtcharts
          $qtPrefix = Join-Path $qtRoot "6.8.3\msvc2022_64"
          "QT_PREFIX=$qtPrefix" | Out-File -FilePath $env:GITHUB_ENV `
            -Encoding utf8 -Append
          (Join-Path $qtPrefix "bin") | Out-File -FilePath $env:GITHUB_PATH `
            -Encoding utf8 -Append

      - name: Verify bundled Windows SDK
        shell: pwsh
        run: |
          $dll = "third_party/Prism-SDK/runtime/windows-x64/prism_usb_sdk.dll"
          $expected = "952681071ea9f8e17162927dbc12b06e4884b0a9636417e35c506a41ec05a8eb"
          $actual = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Bundled prism_usb_sdk.dll checksum mismatch"
          }

      - name: Configure and build Viewer
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" `
            -DBUILD_TESTING=ON
          cmake --build build-windows --config Release --parallel

      - name: Test Viewer
        shell: pwsh
        run: ctest --test-dir build-windows -C Release --output-on-failure

      - name: Package Viewer
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "prism-viewer-stage"
          cmake --install build-windows --config Release --prefix $stage
          $exe = Join-Path $stage "bin\prism-viewer.exe"
          & (Join-Path $env:QT_PREFIX "bin\windeployqt.exe") `
            --release --no-translations --no-compiler-runtime `
            --dir (Join-Path $stage "bin") $exe

          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Redist.14.Latest `
            -property installationPath).Trim()
          $redistRoot = Join-Path $vsInstall "VC\Redist\MSVC"
          $redistDir = Get-ChildItem $redistRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object {
              Join-Path $_.FullName "x64\Microsoft.VC143.CRT"
            } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $redistDir) {
            throw "Visual C++ x64 redistributable runtime was not found"
          }
          Copy-Item (Join-Path $redistDir "*.dll") `
            (Join-Path $stage "bin")

          $package = Join-Path $env:RUNNER_TEMP `
            "Prism-Viewer-1.0.0-windows-x64"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item (Join-Path $stage "bin\*") $package -Recurse

          $required = @(
            "prism-viewer.exe",
            "prism_usb_sdk.dll",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "Qt6Charts.dll",
            "Qt6Sql.dll",
            "platforms\qwindows.dll",
            "imageformats\qjpeg.dll",
            "sqldrivers\qsqlite.dll",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )
          foreach ($relative in $required) {
            if (-not (Test-Path (Join-Path $package $relative))) {
              throw "Missing packaged runtime dependency: $relative"
            }
          }

          Push-Location $package
          Get-ChildItem -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($package, $_.FullName)
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $relative"
            } | Set-Content -Encoding utf8 "SHA256SUMS.txt"
          Pop-Location

          Compress-Archive -Path $package `
            -DestinationPath "Prism-Viewer-1.0.0-windows-x64.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: prism-viewer-1.0.0-windows-x64
          if-no-files-found: error
          path: Prism-Viewer-1.0.0-windows-x64.zip

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Viewer
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            ninja-build \
            patchelf \
            qt6-base-dev \
            qt6-charts-dev \
            libqt6sql6-sqlite \
            libxcb-cursor0 \
            libusb-1.0-0 \
            libssl3

      - name: Install Qt 6.8.3
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          qt_root="$RUNNER_TEMP/Qt"
          aqt install-qt linux desktop 6.8.3 linux_gcc_64 \
            -O "$qt_root" -m qtcharts
          qt_prefix="$qt_root/6.8.3/gcc_64"
          echo "QT_PREFIX=$qt_prefix" >> "$GITHUB_ENV"
          echo "$qt_prefix/bin" >> "$GITHUB_PATH"

      - name: Verify bundled Linux SDK
        run: |
          echo "73c8278aca4a50057d2fc0f897ac465a402bcbae2426a8f4c5b9eaa0ee5b2516  third_party/Prism-SDK/runtime/linux-x64/libprism_usb_sdk.so" | sha256sum --check

      - name: Configure and build Viewer
        run: |
          cmake -S . -B build-linux-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DPRISM_DEPLOY_RUNTIME_DEPENDENCIES=ON \
            -DBUILD_TESTING=ON
          cmake --build build-linux-ci --parallel

      - name: Test Viewer
        run: ctest --test-dir build-linux-ci --output-on-failure

      - name: Package Viewer
        run: |
          stage="$RUNNER_TEMP/prism-viewer-stage"
          package="$RUNNER_TEMP/Prism-Viewer-1.0.0-linux-x64"
          cmake --install build-linux-ci --prefix "$stage"
          mkdir -p "$package"
          cp -a "$stage"/. "$package"/

          qt_plugins=(
            "platforms/libqxcb.so"
            "imageformats/libqjpeg.so"
            "sqldrivers/libqsqlite.so"
          )
          for relative in "${qt_plugins[@]}"; do
            qt_plugin_source="$QT_PREFIX/plugins/$relative"
            if [ ! -f "$qt_plugin_source" ]; then
              echo "Required Qt plugin is missing: $qt_plugin_source" >&2
              exit 1
            fi
            mkdir -p "$package/plugins/$(dirname "$relative")"
            cp -L "$qt_plugin_source" "$package/plugins/$relative"
          done

          # The SDK links libcrypto directly today, while libssl can also be
          # loaded by OpenSSL-backed features without appearing in the main
          # executable's dependency graph. Keep the OpenSSL 3 runtime pair
          # together so the extracted package never depends on a host OpenSSL
          # installation.
          for name in libcrypto.so.3 libssl.so.3; do
            source="$(ldconfig -p \
              | awk -v library="$name" '$1 == library { print $NF; exit }')"
            if [ -z "$source" ] || [ ! -f "$source" ]; then
              echo "Required OpenSSL runtime is missing: $name" >&2
              exit 1
            fi
            cp -L "$source" "$package/lib/$name"
          done

          # Plugins are loaded with dlopen(), so they are not visible from the
          # main executable's link graph. Resolve their dependencies and any
          # further transitive dependencies until the package is closed.
          for pass in {1..10}; do
            dependency_list="$RUNNER_TEMP/prism-runtime-dependencies-$pass.txt"
            : > "$dependency_list"
            while IFS= read -r -d '' binary; do
              if readelf -h "$binary" >/dev/null 2>&1; then
                LD_LIBRARY_PATH="$package/lib:$QT_PREFIX/lib" \
                  ldd "$binary" 2>/dev/null \
                  | awk '
                      $2 == "=>" && $3 ~ /^\// { print $3 }
                      $1 ~ /^\// { print $1 }
                    ' >> "$dependency_list"
              fi
            done < <(find "$package" -type f -print0)

            copied=0
            while IFS= read -r dependency; do
              case "$dependency" in
                "$package"/*) continue ;;
              esac
              name="${dependency##*/}"
              case "$name" in
                ld-linux* | libc.so.* | libdl.so.* | libm.so.* | \
                libpthread.so.* | libresolv.so.* | librt.so.* | \
                libutil.so.*)
                  continue
                  ;;
              esac
              if [ ! -e "$package/lib/$name" ]; then
                cp -L "$dependency" "$package/lib/$name"
                copied=$((copied + 1))
              fi
            done < <(sort -u "$dependency_list")

            if [ "$copied" -eq 0 ]; then
              break
            fi
            if [ "$pass" -eq 10 ]; then
              echo "Runtime dependency collection did not converge" >&2
              exit 1
            fi
          done

          # DT_RUNPATH is not transitive. The executable's $ORIGIN/../lib
          # entry can locate libprism_usb_sdk.so, but it cannot locate the
          # SDK's own libcrypto dependency unless the SDK and every other ELF
          # object carry a path back to the packaged lib directory. Patch a
          # location-independent RUNPATH into every real ELF file.
          while IFS= read -r -d '' binary; do
            if readelf -h "$binary" >/dev/null 2>&1; then
              relative_lib="$(realpath --relative-to="$(dirname "$binary")" \
                "$package/lib")"
              runtime_path="\$ORIGIN"
              if [ "$relative_lib" != "." ]; then
                runtime_path="$runtime_path/$relative_lib"
              fi
              patchelf --set-rpath "$runtime_path" "$binary"
            fi
          done < <(find "$package" -type f -print0)

          required_patterns=(
            "bin/prism-viewer"
            "lib/libprism_usb_sdk.so"
            "lib/libQt6Core.so.6"
            "lib/libQt6Gui.so.6"
            "lib/libQt6Widgets.so.6"
            "lib/libQt6Charts.so.6"
            "lib/libQt6Sql.so.6"
            "lib/libcrypto.so.3"
            "lib/libssl.so.3"
            "lib/libusb-1.0.so.0"
            "*/platforms/libqxcb.so"
            "*/imageformats/libqjpeg.so"
            "*/sqldrivers/libqsqlite.so"
          )
          for pattern in "${required_patterns[@]}"; do
            if ! compgen -G "$package/$pattern" >/dev/null; then
              echo "Missing packaged runtime dependency: $pattern" >&2
              exit 1
            fi
          done

          : > "$package/RUNTIME_DEPENDENCIES.txt"
          : > "$package/ELF_FILES.txt"
          while IFS= read -r -d '' binary; do
            if readelf -h "$binary" >/dev/null 2>&1; then
              relative="${binary#"$package"/}"
              printf '%s\n' "$relative" >> "$package/ELF_FILES.txt"
              printf '\n[%s]\n' "$relative" \
                >> "$package/RUNTIME_DEPENDENCIES.txt"
              ldd "$binary" >> "$package/RUNTIME_DEPENDENCIES.txt"
            fi
          done < <(find "$package" -type f -print0)
          if grep -q "not found" "$package/RUNTIME_DEPENDENCIES.txt"; then
            cat "$package/RUNTIME_DEPENDENCIES.txt"
            exit 1
          fi

          docker run --rm \
            -v "$package:/opt/prism-viewer:ro" \
            ubuntu:24.04 /bin/bash -euc '
              while IFS= read -r relative; do
                output="$(ldd "/opt/prism-viewer/$relative" 2>&1)"
                printf "\n[%s]\n%s\n" "$relative" "$output"
                if grep -q "not found" <<<"$output"; then
                  exit 1
                fi
              done < /opt/prism-viewer/ELF_FILES.txt

              app="$(ldd /opt/prism-viewer/bin/prism-viewer)"
              sdk="$(ldd /opt/prism-viewer/lib/libprism_usb_sdk.so)"
              ssl="$(ldd /opt/prism-viewer/lib/libssl.so.3)"
              grep -Fq \
                "libprism_usb_sdk.so => /opt/prism-viewer/lib/libprism_usb_sdk.so" \
                <<<"$app"
              grep -Fq \
                "libcrypto.so.3 => /opt/prism-viewer/lib/libcrypto.so.3" \
                <<<"$sdk"
              grep -Fq \
                "libcrypto.so.3 => /opt/prism-viewer/lib/libcrypto.so.3" \
                <<<"$ssl"
            '

          checksum_manifest="$RUNNER_TEMP/prism-viewer-SHA256SUMS.txt"
          (
            cd "$package"
            find . -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > "$checksum_manifest"
          mv "$checksum_manifest" "$package/SHA256SUMS.txt"
          tar -C "$RUNNER_TEMP" -czf \
            "$GITHUB_WORKSPACE/Prism-Viewer-1.0.0-linux-x64.tar.gz" \
            Prism-Viewer-1.0.0-linux-x64

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: prism-viewer-1.0.0-linux-x64
          if-no-files-found: error
          path: Prism-Viewer-1.0.0-linux-x64.tar.gz

  macos-arm64:
    # GitHub's runner-images catalog maps this fixed label to the standard
    # Apple Silicon image. Do not use macos-latest here: its OS version moves
    # independently, while this package must keep using the arm64 SDK runtime.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out Viewer
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers

      - name: Install macOS dependencies
        run: |
          brew install cmake ninja
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          qt_root="$RUNNER_TEMP/Qt"
          aqt install-qt mac desktop 6.8.3 clang_64 \
            -O "$qt_root" -m qtcharts
          qt_prefix="$qt_root/6.8.3/macos"
          qt_core="$qt_prefix/lib/QtCore.framework/Versions/A/QtCore"
          for qt_binary in "$qt_core" "$qt_prefix/bin/macdeployqt"; do
            case " $(lipo -archs "$qt_binary") " in
              *" arm64 "*) ;;
              *)
                echo "Qt 6.8.3 clang_64 does not contain arm64 code" >&2
                file "$qt_binary" >&2
                exit 1
                ;;
            esac
          done
          echo "QT_PREFIX=$qt_prefix" >> "$GITHUB_ENV"
          echo "$qt_prefix/bin" >> "$GITHUB_PATH"

      - name: Verify bundled macOS SDK
        run: |
          sdk="third_party/Prism-SDK/runtime/macos-arm64/libprism_usb_sdk.dylib"
          libusb="third_party/Prism-SDK/runtime/macos-arm64/libusb-1.0.0.dylib"
          license="third_party/Prism-SDK/runtime/macos-arm64/libusb-COPYING.txt"
          sdk_expected="03db8a8ff801f2623046818e2703b817308c4a8276b32dbcabbb1fb1664d93a4"
          libusb_expected="6f65716831f5072bbae4286903c1efce7588ecdbf9d9d4df01122a30cded3b01"
          sdk_actual="$(shasum -a 256 "$sdk" | awk '{print $1}')"
          libusb_actual="$(shasum -a 256 "$libusb" | awk '{print $1}')"
          if [ "$sdk_actual" != "$sdk_expected" ]; then
            echo "Bundled libprism_usb_sdk.dylib checksum mismatch" >&2
            echo "expected=$sdk_expected" >&2
            echo "actual=$sdk_actual" >&2
            exit 1
          fi
          if [ "$libusb_actual" != "$libusb_expected" ]; then
            echo "Bundled libusb-1.0.0.dylib checksum mismatch" >&2
            echo "expected=$libusb_expected" >&2
            echo "actual=$libusb_actual" >&2
            exit 1
          fi
          if [ ! -s "$license" ]; then
            echo "Bundled libusb license is missing or empty" >&2
            exit 1
          fi
          for runtime in "$sdk" "$libusb"; do
            if [ "$(lipo -archs "$runtime")" != "arm64" ]; then
              echo "Bundled runtime is not an arm64-only Mach-O image" >&2
              file "$runtime" >&2
              exit 1
            fi
            file "$runtime"
            otool -L "$runtime"
          done

      - name: Configure and build Viewer
        run: |
          cmake -S . -B build-macos-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DBUILD_TESTING=ON
          cmake --build build-macos-ci --parallel

      - name: Test Viewer
        run: ctest --test-dir build-macos-ci --output-on-failure

      - name: Package self-contained macOS app
        run: |
          stage="$RUNNER_TEMP/prism-viewer-stage"
          app="$stage/Prism-Viewer.app"
          frameworks="$app/Contents/Frameworks"
          executable="$app/Contents/MacOS/Prism-Viewer"
          sdk="$frameworks/libprism_usb_sdk.dylib"

          cmake --install build-macos-ci --prefix "$stage"
          test -d "$app"
          test -x "$executable"
          test -f "$sdk"
          test -f "$frameworks/libusb-1.0.0.dylib"

          "$QT_PREFIX/bin/macdeployqt" "$app" \
            -always-overwrite -verbose=2
          scripts/prune_macos_qt_plugins.sh "$app" "$QT_PREFIX"
          scripts/deploy_macos_offscreen_plugin.sh "$app" "$QT_PREFIX"
          scripts/restore_macos_sdk_runtime.sh "$app"
          scripts/fixup_macos_bundle.sh "$app"

          # The shipped application must not refer back to the runner's build
          # directories, and every Mach-O image must contain arm64 code.
          find "$app" -type f -print0 | while IFS= read -r -d '' binary; do
            if ! file -b "$binary" | grep -q 'Mach-O'; then
              continue
            fi
            architectures="$(lipo -archs "$binary")"
            case " $architectures " in
              *" arm64 "*) ;;
              *)
                echo "Mach-O file does not contain arm64 code: $binary" >&2
                file "$binary" >&2
                exit 1
                ;;
            esac
            otool -L "$binary"
            while IFS= read -r dependency; do
              case "$dependency" in
                /System/Library/* | /usr/lib/* | @rpath/* | \
                @loader_path/* | @executable_path/*)
                  ;;
                *)
                  echo "Non-portable dependency in $binary: $dependency" >&2
                  exit 1
                  ;;
              esac
            done < <(otool -L "$binary" |
                       awk '/^[[:space:]]/ { print $1 }')
          done

          codesign --force --deep --sign - "$app"
          scripts/verify_macos_bundle.sh "$app"
          QT_QPA_PLATFORM=offscreen \
            "$executable" --imu-only-recorder-self-test \
            "$RUNNER_TEMP/macos-package-smoke"

          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "$GITHUB_WORKSPACE/Prism-Viewer-1.0.0-macos-arm64.zip"
          unzip -t Prism-Viewer-1.0.0-macos-arm64.zip

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: prism-viewer-1.0.0-macos-arm64
          if-no-files-found: error
          path: Prism-Viewer-1.0.0-macos-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, linux-x64, macos-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: prism-viewer-1.0.0-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes
          fi
